[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajseeder"
dynamic = ["version"] # Version tracked in trajseeder/__init__, updated automatically to avoid forgetting both
description = "Seed molecular dynamics trajectories from structural ensembles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Vincent Voelz"},
    {name = "Preston Waters"}
]
license = {text = "MIT"}

dependencies = []

[project.urls]
Homepage = "https://github.com/vvoelz/trajseeder"

[project.scripts]
trajseeder = "trajseeder.cli.main:main"

[tool.setuptools.packages.find]
include = ["trajseeder*"]

[tool.setuptools.dynamic]
version = {attr = "trajseeder.__version__"}
