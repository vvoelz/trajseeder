[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajseeder"
version = "1.1.0"
description = "Seed molecular dynamics trajectories from structural ensembles"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Vincent Voelz"},
    {name = "Preston Waters"}
]
license = {text = "MIT"}

dependencies = [
    "typer>=0.27.3",
    "tqdm>=4.70.1",
    "openmm>=8.3.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/vvoelz/trajseeder"

[project.scripts]
trajseeder = "trajseeder.cli.main:main"

[tool.setuptools.packages.find]
include = ["trajseeder*"]

