[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajseeder"
version = "0.0.1"
description = "Seed molecular dynamics trajectories from structural ensembles"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Vincent Voelz"},
    {name = "Preston Waters"}
]
license = {text = "MIT"}

dependencies = []

[project.urls]
Homepage = "https://github.com/vvoelz/trajseeder"

[project.scripts]
trajseeder = "trajseeder.cli.main:main"

[tool.setuptools.packages.find]
include = ["trajseeder"]
